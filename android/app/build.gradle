plugins {
    id "com.android.application"
}

def releaseStore = System.getenv("DV_KEYSTORE_PATH")
def releaseAlias = System.getenv("DV_KEY_ALIAS")
def releaseStorePassword = System.getenv("DV_KEYSTORE_PASSWORD")
def releaseKeyPassword = System.getenv("DV_KEY_PASSWORD")
def releaseSigningReady = [releaseStore, releaseAlias, releaseStorePassword, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }
def supabaseUrl = System.getenv("DV_SUPABASE_URL") ?: "https://dmhnibhyglkxobyuicdu.supabase.co"
def supabasePublishableKey = System.getenv("DV_SUPABASE_PUBLISHABLE_KEY") ?: "sb_publishable_pvKcFs7k6psNmCPAR8Uv5g_I9ap9D58"
def buildConfigString = { String value -> "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\"" }

android {
    namespace "ir.dadban.app"
    compileSdk 37

    defaultConfig {
        applicationId "ir.dadban.app"
        minSdk 23
        targetSdk 37
        versionCode 11
        versionName "10.0.0"
        buildConfigField "String", "SUPABASE_URL", buildConfigString(supabaseUrl)
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", buildConfigString(supabasePublishableKey)
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains("release") } && !releaseSigningReady) {
        throw new GradleException("Release signing variables are required; unsigned release output is forbidden.")
    }
}
